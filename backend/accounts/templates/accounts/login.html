{% extends 'navbar.html' %} {% block title %} Iniciar sesión {% endblock %}
{%block content %}
<div class="container text-center">
  <br />
  
  {% if error_message %}
  <div class="alert alert-danger" role="alert">{{ error_message }}</div>
  {% else %}
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="68"
    height="68"
    fill="currentColor"
    class="bi bi-person-fill-up"
    viewBox="0 0 16 16"
  >
    <path
      d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.354-5.854 1.5 1.5a.5.5 0 0 1-.708.708L13 11.707V14.5a.5.5 0 0 1-1 0v-2.793l-.646.647a.5.5 0 0 1-.708-.708l1.5-1.5a.5.5 0 0 1 .708 0M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0"
    />
    <path
      d="M2 13c0 1 1 1 1 1h5.256A4.5 4.5 0 0 1 8 12.5a4.5 4.5 0 0 1 1.544-3.393Q8.844 9.002 8 9c-5 0-6 3-6 4"
    />
  </svg>
  <h3>Iniciar sesión</h3>
  
  {% endif %}
  <div class="container-fluid">
    <div class="row">
      <form
        method="post"
        action="{% url 'login' %}"
        class="bg-dark-subtle text-light-emphasis rounded-4"
      >
        {% csrf_token %}
        <div>
          <div class="row">
            <div class="col"></div>
            <div class="col-8">
              <label for="id_email" class="col-form-label">Email:</label>
            </div>
            <div class="col"></div>
          </div>
        </div>
        <div class="row">
          <div class="col"></div>
          <div class="col-8">
            <input
              class="form-control"
              type="email"
              id="id_email"
              name="email"
              required
            />
          </div>
          <div class="col"></div>
        </div>
        <div>
          <div>
            <div class="row">
              <div class="col"></div>
              <div class="col-8">
                <label for="id_password" class="col-form-label"
                  >Contraseña:</label
                >
              </div>
              <div class="col"></div>
            </div>
          </div>
          <div class="row">
            <div class="col"></div>
            <div class="col-8">
              <input
                class="form-control"
                type="password"
                id="id_password"
                name="password"
                required
              />
            </div>
            <div class="col"></div>
          </div>
        </div>
        <div>
          <br />
          <div class="row">
            <div class="col"></div>
            <div class="col-8">
              <button type="submit" class="btn btn-primary">
                Iniciar sesión
              </button>
            </div>
            <div class="col"></div>
          </div>
          <br />
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
