<div class="container" id="crearPago">
    <div class="modal fade" id="crearPagoModal" tabindex="-1" aria-labelledby="prestamoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="crearPagoModalLabel">Crear Pago-Cuota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="crearPagoForm" method="post" action="{% url 'nuevo_pago_cuota' %}">
                        {% csrf_token %}
                        <div class="input-group mb-3">
                            <div class="input-group mb-3 ">
                                <span class="input-group-text">Id Cuota: </span>
                                <input id="cuota" class="form-control border border-secondary-subtle" name="cuota"
                                    disabled>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">Nombre Usuario:</span>
                                <input id="owner" class="form-control border border-secondary-subtle" name="owner"
                                    placeholder="Ingrese o seleccione un usuario..." list="datalistUsersOptions"
                                    required>
                                <datalist id="datalistUsersOptions">
                                    <!-- Obtenemos los ejemplares del material dinamicamente -->
                                </datalist>

                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">Monto:</span>
                                <input type="number" class="form-control border border-secondary-subtle" id="monto"
                                    name="monto" placeholder="$">


                            </div>
                        </div>
                        <div id="message-prestamo" style="display: none;"></div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                onclick="volver()">Cerrar</button>
                            <button type="submit" class="btn btn-primary">Crear
                                Pago</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function usuarioNuevoPago(IDusuario) {
        const userId = Number(IDusuario)
        fetch(`/accounts/users/`)
            .then(response => response.json())
            .then(data => {                
                let usr = data.find(user => user.id === userId)
                let inputOwner = document.getElementById('owner')
                if (usr) {
                    inputOwner.value = usr.email
                } else {
                    console.log('usuario no encontrado')
                }
            })
    }
    document.addEventListener('DOMContentLoaded', () => {
        fetch(`/accounts/users/`)
            .then(response => response.json())
            .then(data => {
                console.log(data);

                let datalistUsers = document.getElementById('datalistUsersOptions');
                datalistUsers.innerHTML = '';
                data.forEach(user => {
                    let option = document.createElement('option');
                    option.value = user.email;
                    datalistUsers.appendChild(option);
                });
            })
    })
    document.addEventListener('DOMContentLoaded', () => {
        fetch(`/facturacion/gestionar/data/`)
            .then(response => response.json())
            .then(data => {
                data = data[0]
                console.log(data);

                let monto = document.getElementById('monto');
                monto.value = data.monto;
                
                
            })
    })
    function Limpiar() {
        let messagesPrestamo = document.getElementById('message-prestamo');
        messagesPrestamo.style.display = 'none';
        messagesPrestamo.textContent = '';

    }
    function volver() {
        window.location.replace(window.location.href)
    }

    document.getElementById('crearPagoForm').addEventListener('submit', function (event) {
        event.preventDefault()

        const form = event.target;
        const formData = new FormData(form);
        let messagesPrestamo = document.getElementById('message-prestamo');
        Limpiar();

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text) });
                }
                console.log(response);
                return response.json();
            })
            .then(data => {

                if (data.success) {
                    console.log(data);
                    messagesPrestamo.className = 'alert alert-success';
                    messagesPrestamo.textContent = data.message;
                    messagesPrestamo.style.display = 'block';

                } else {
                    console.log(data);
                    messagesPrestamo.className = 'alert alert-danger';
                    messagesPrestamo.textContent = data.message;
                    messagesPrestamo.style.display = 'block';
                }
            })
            .catch(error => {
                console.error("Error: ", error)
                messagesPrestamo.className = 'alert alert-danger';
                messagesPrestamo.textContent = `${error.message}`;
                messagesPrestamo.style.display = 'block';
            })

    })
</script>
