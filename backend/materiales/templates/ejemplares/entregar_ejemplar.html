<div class="container" id="crearPrestamo">
  <div class="modal fade" id="crearPrestamoModal" tabindex="-1" aria-labelledby="prestamoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="crearPrestamoModalLabel">Crear prestamo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="crearPrestamoForm" method="post" action="{% url 'nuevo_prestamo' %}">
            {% csrf_token %}
            <div class="input-group mb-3">
              <div class="input-group mb-3 ">
                <span class="input-group-text">Material: </span>
                <input id="material" type="text" class="form-control border border-secondary-subtle" name="material"
                  placeholder="Ingrese o seleccione un Material..." list="datalistMaterialesOptions" disabled>
                <datalist id="datalistMaterialesOptions">
                  <!-- Obtenemos los ejemplares del material dinamicamente -->
                </datalist>
              </div>
              <div class="input-group mb-3">
                <span class="input-group-text">ID Ejemplar:</span>
                <input id="IdEjemplar" type="number" class="form-control border border-secondary-subtle" name="ejemplar"
                  placeholder="Ingreser o seleccione un Ejemplar..." list="datalistEjemplaresOptions" required>
                <datalist id="datalistEjemplaresOptions">
                  <!-- Obtenemos los ejemplares del material dinamicamente -->
                </datalist>

              </div>
              <div class="input-group mb-3">
                <span class="input-group-text">Usuario E-mail:</span>
                <input type="text" class="form-control border border-secondary-subtle" id="owner" name="owner"
                  placeholder="Ingrese un e-mail..." list="datalistUsersOptions"  required>
                <datalist id="datalistUsersOptions">
                  <!-- Obtenemos los ejemplares del material dinamicamente -->
                </datalist>

              </div>
            </div>
            <div id="message-prestamo" style="display: none;"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="volver()">Cerrar</button>
              <button id="btn-create" type="submit" class="btn btn-primary">Crear
                Prestamo</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  ejemplaresDisponibles = null;
  function prestarEjemplar(ejemplarId) {
    Limpiar();
    fetch(`/material/ejemplar/${ejemplarId}/`)
      .then(response => response.json())
      .then(data => {
        console.log('material: ' +  data)
        console.log('material: ' +  data.material.id)
        document.getElementById('crearPrestamoForm').action = `/movimientos/prestamos/nuevo/`
        document.getElementById('crearPrestamoModalLabel').textContent = 'Entregar ejemplar'
        let inputEjemplar = document.getElementById('IdEjemplar');
        inputEjemplar.value = data.id;
        inputEjemplar.disabled = true;
        let material = document.getElementById('material');
        material.value = data.material.titulo;
      });

    fetch(`/accounts/users/`)
      .then(response => response.json())
      .then(data => {
        console.log('user' + data);

        let datalistUsers = document.getElementById('datalistUsersOptions');
        datalistUsers.innerHTML = '';
        data.forEach(user => {
          let option = document.createElement('option');
          option.value = user.email;
          console.log('material:' + option.value)
          datalistUsers.appendChild(option);
        });
      })

  }
  function reservaEntregarEjemplar(reserva) {
    fetch(`/movimientos/reservas/${reserva}/entregar_ejemplar/`)
      .then(response => response.json())
      .then(data => {
        document.getElementById('crearPrestamoModalLabel').textContent = 'Entregar ejemplar de reserva'
        document.getElementById('crearPrestamoForm').action = `/movimientos/reservas/${reserva}/entregar_ejemplar/`
        let material = document.getElementById('material');
        material.value = data.reserva.material.titulo;

        let usuario = document.getElementById('owner');
        usuario.value = data.reserva.owner.email;

        let ejemplaresDisponibles = data.reserva.material.ejemplares_disponibles.map(ejemplar => ejemplar.toString());

        let datalist = document.getElementById('datalistEjemplaresOptions');
        datalist.innerHTML = '';
        ejemplaresDisponibles.forEach(ejemplar => {
          let option = document.createElement('option');
          option.value = ejemplar;
          datalist.appendChild(option);
        });
      });
  }

  function prestarMaterialEjemplar(material) {
    fetch(`/material/${material}/detail`)
      .then(response => response.json())
      .then(data => {
        console.log(data)
        let material = document.getElementById('material');
        material.value = data.titulo;

        let datalist = document.getElementById('datalistEjemplaresOptions');
        datalist.innerHTML = '';
        data.ejemplares_disponibles.forEach(ejemplar => {
          let option = document.createElement('option');
          option.value = ejemplar;
          datalist.appendChild(option);
        });
      });

    fetch(`/accounts/users/`)
      .then(response => response.json())
      .then(data => {
        console.log(data);

        let datalistUsers = document.getElementById('datalistUsersOptions');
        datalistUsers.innerHTML = '';
        datalistUsers.forEach(user => {
          let option = document.createElement('option');
          option.value = user.email;
          datalistUsers.appendChild(option);
        });
      })
  }

  function nuevoPrestamo() {
    fetch(`/material/materiales/`)
      .then(response => response.json())
      .then(data => {
        console.log('material: '+data)
        document.getElementById('material').disabled = false;
        let datalistMateriales = document.getElementById('datalistMaterialesOptions');
        datalistMateriales.innerHTML = '';
        data.forEach(material => {
          let option = document.createElement('option');
          option.value = material.titulo;
          datalistMateriales.appendChild(option);
        });

        document.getElementById('material').addEventListener('input', function () {
          const materialTitulo = this.value;
          fetch(`/material/materiales/`)
            .then(response => response.json())
            .then(data => {
              const material = data.find(m => m.titulo === materialTitulo);
              if (material) {
                let datalistEjemplares = document.getElementById('datalistEjemplaresOptions');
                datalistEjemplares.innerHTML = '';
                material.ejemplares_disponibles.forEach(ejemplar => {
                  let option = document.createElement('option');
                  option.value = ejemplar;
                  datalistEjemplares.appendChild(option);
                });
              }
            });
        });

        document.getElementById('IdEjemplar').addEventListener('input', function () {
          const ejemplarId = this.value;
          fetch(`/material/ejemplar/${ejemplarId}/`)
            .then(response => response.json())
            .then(data => {
              if (data && data.material) {
                document.getElementById('material').value = data.material.titulo;
              } else {
                document.getElementById('material').value = '';
              }
            });
        });
      });

    fetch(`/accounts/users/`)
      .then(response => response.json())
      .then(data => {
        console.log('user: ' + data);

        let datalistUsers = document.getElementById('datalistUsersOptions');
        datalistUsers.innerHTML = '';
        data.forEach(user => {
          let option = document.createElement('option');
          option.value = user.email;
          datalistUsers.appendChild(option);
        });
      })
  }

  function Limpiar() {
    let messagesPrestamo = document.getElementById('message-prestamo');
    messagesPrestamo.style.display = 'none';
    messagesPrestamo.textContent = '';

  }

  function volver() {
    window.location.replace(window.location.href)
  }

  document.getElementById('crearPrestamoForm').addEventListener('submit', function (event) {
    event.preventDefault()

    const form = event.target;
    const formData = new FormData(form);
    const inputEjemplar = document.getElementById('IdEjemplar').value;
    const inputOwner = document.getElementById('owner').value
    let messagesPrestamo = document.getElementById('message-prestamo');
    Limpiar();

    console.log('ejemplares: ' + inputEjemplar)
    console.log('usuario: ' + inputOwner)
    if (ejemplaresDisponibles) {      
      if (!ejemplaresDisponibles.includes(inputEjemplar)) {
        messagesPrestamo.className = 'alert alert-danger';
        messagesPrestamo.textContent = 'Ejemplar no valido';
        messagesPrestamo.style.display = 'block'
        console.log(true)
        return;
      }

    }

    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: {
        'X-Requested-With': 'XMLHttpRequest'
      }
    })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text) });
        }
        console.log('response: '+ response);
        return response.json();
      })
      .then(data => {

        if (data.success) {
          console.log(data);
          messagesPrestamo.className = 'alert alert-success';
          messagesPrestamo.textContent = data.message;
          messagesPrestamo.style.display = 'block';
          let btn = document.getElementById('btn-create')
          btn.textContent = 'ir al prestamo'
          btn.onclick = function () { window.location.href = "/movimientos/prestamo/" + data.id }
          


        } else {
          console.log(data);
          messagesPrestamo.className = 'alert alert-danger';
          messagesPrestamo.textContent = data.message;
          messagesPrestamo.style.display = 'block';
        }
      })
      .catch(error => {
        console.error("Error: ", error)
        messagesPrestamo.className = 'alert alert-danger';
        messagesPrestamo.textContent = `${error.message}`;
        messagesPrestamo.style.display = 'block';
      })

  })

</script>
