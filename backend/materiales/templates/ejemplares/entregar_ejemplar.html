<div class="container" id="crearPrestamo">
  <div class="modal fade" id="crearPrestamoModal" tabindex="-1" aria-labelledby="prestamoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="crearPrestamoModalLabel">Crear prestamo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="crearPrestamoForm" method="post" action="{% url 'nuevo_prestamo' %}">
            {% csrf_token %}
            <div class="input-group mb-3">
              <div class="input-group mb-3 ">
                <span class="input-group-text">Material: </span>
                <input id="material" class="form-control border border-secondary-subtle" name="material"
                  placeholder="Ingrese o seleccione un Material..." disabled>
              </div>
              <div class="input-group mb-3">
                <span class="input-group-text">ID Ejemplar:</span>
                <input type="text" class="form-control border border-secondary-subtle" id="ejemplar" name="ejemplar"
                  placeholder="Ingreser o seleccione un Ejemplar..." list="datalistEjemplaresOptions">
                <datalist id="datalistEjemplaresOptions">
                  <!-- Obtenemos los ejemplares del material dinamicamente -->
                </datalist>

              </div>
              <div class="input-group mb-3">
                <span class="input-group-text">Usuario E-mail:</span>
                <input type="text" class="form-control border border-secondary-subtle" id="owner" name="owner"
                  placeholder="Ingrese un e-mail..." list="datalistUsersOptions">
                <datalist id="datalistUsersOptions">
                  <!-- Obtenemos los ejemplares del material dinamicamente -->
                </datalist>

              </div>
            </div>
            <div class="alert alert-success" id="message-success" style="display: none;"></div>
            <div class="alert alert-danger" id="message-error" style="display: none;"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
              <button type="button" class="btn btn-primary" onclick="crearPrestamo()">Crear
                Prestamo</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function prestarEjemplar(material) {
    fetch(`/material/${material}/detail`)
      .then(response => response.json())
      .then(data => {
        console.log(data)
        let material = document.getElementById('material');
        material.value = data.titulo;

        let datalist = document.getElementById('datalistEjemplaresOptions');
        datalist.innerHTML = '';
        data.ejemplares_disponibles.forEach(ejemplar => {
          let option = document.createElement('option');
          option.value = ejemplar;
          datalist.appendChild(option);
        });
      });

    fetch(`accounts/users/`)
      .then(response => response.json())
      .then(data => {
        console.log(data);

        let datalistUsers = document.getElementById('datalistUsersOptions');
        datalistUsers.innerHTML = '';
        data.forEach(user => {
          let option = document.createElement('option');
          option.value = user.email;
          datalistUsers.appendChild(option);
        });
      })
  }

  function crearPrestamo() {
    const form = document.getElementById('crearPrestamoForm')
    const formData = new FormData(form)

    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: {
        'X-Requested-With': 'XMLHttpRequest'
      }
    })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text) });
        }
        console.log(response);
        return response.json();
      })
      .then(data => {
        if (data.success) {
          console.log(data);
        } else {
          console.log(data);
        }
      })
      .catch(error => {
        console.error("Error: ", error)
      })
  }

</script>
