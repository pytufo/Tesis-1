<div class="modal fade" id="materialReservaModal" tabindex="-1" aria-labelledby="ModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" id="title">
        <h1 class="modal-title fs-5" id="ModalLabel"> Reservar <!-- Id y Titulo del material --> </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text center">
        <!-- El contenido del mensaje se actualiza dinamicamente -->
      </div>
      <div id="message-success" style="display: none;"></div>

      <div class="modal-footer">
        <form id="reservarMaterialForm" method="post">
          {% csrf_token %}
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnCrearReserva">Confirmar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById('btnCrearReserva')

  function reservarModal(material) {

    fetch(`/material/${material}/detail`)
      .then(response => response.json())
      .then(data => {
        console.log(data);
        var modal = document.getElementById('materialReservaModal');
        var modalBody = modal.querySelector('.modal-body');
        if (data.estado == "Disponible") {
          document.getElementById('title').innerHTML = '<h5>Reservar.</h5>'
          modalBody.innerHTML = '¿Desea reservar el material: "' + data.titulo + '" ? <br/>' + " Recuerde que al reservar un material este tiene una vigencia de 24hs a partir de este momento, en caso de no retirar el material en el tiempo estimado la reserva del mismo sera finalizada automaticamente."
        } else {
          document.getElementById('title').innerHTML = '<h5>ups!, El material no se encuentra disponible.</h5>'
          modalBody.innerHTML = '¿Desea añadirse a la lista de espera del material: <b>"' + data.titulo + '"</b> ?. <br/>' + " Cuando el material se encuentre disponible se creara automaticamente una reserva, la cual será notificado. Recuerde que al crearse la reserva tiene una vigencia de 24hs a partir de ese momento, en caso de no retirar el material en el tiempo estimado la reserva del mismo sera finalizada automaticamente. ."
        }
        document.getElementById('reservarMaterialForm').action = `/material/${material}/reservar/`;
      })
  }

  function Limpiar() {
    let Messages = document.getElementById('message-success');
    Messages.style.display = 'none';
    Messages.textContent = '';

  }

  document.getElementById('reservarMaterialForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const form = event.target;
    const formReserva = new FormData(form);
    Limpiar();

    fetch(form.action, {
      method: 'POST',
      body: formReserva,
      headers: {
        'X-Requested-With': 'XMHttpRequest'
      }
    })
      .then(response => response.json())
      .then(data => {
        let Message = document.getElementById('message-success')
        if (data.success) {
          Message.className = 'alert alert-success';
          Message.textContent = data.message;
          Message.style.display = 'block';
          btn.type = 'button';
          btn.textContent = 'Ir a reserva'
          btn.onclick = function () { window.location.href = "/movimientos/reserva/" + data.id; }
        } else if (data.status == 511) {
          console.log("Usuario no logueado")

          btn.type = 'button';
          btn.textContent = 'iniciar sesion'
          btn.onclick = function () { window.location.href = '/accounts/login/'; }
          Message.className = 'alert alert-danger';
          Message.textContent = data.message
          Message.style.display = 'block';
        } else {
          Message.className = 'alert alert-danger';
          Message.textContent = data.message
          Message.style.display = 'block';
        }
      })
      .catch(error => {
        let Message = document.getElementById('message-success');
        Message.className = 'alert alert-success';
        Message.textContent = 'Error: ' + error;
        Message.style.display = 'block';
      })
  })

  document.getElementById('materialReservaModal').addEventListener('hidden.bs.modal', Limpiar)

</script>
